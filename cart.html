<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ваша корзина — ООО «БукСтраница»</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo-block">
                <img src="img/logo.png" alt="Логотип БукСтраница" class="main-logo">
                <div class="logo-text">
                    <h1>БукСтраница</h1>
                    <span>Интернет-магазин литературы</span>
                </div>
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-link">Главная</a>
                <a href="about.html" class="nav-link">О нас</a>
                <a href="catalog.html" class="nav-link">Каталог</a>
                <a href="cart.html" class="nav-link cart-link active">
                    <img src="img/icon-cart.png" alt="Корзина" class="nav-icon">
                    <span>Корзина (<span id="cart-count">0</span>)</span>
                </a>
                <a href="register.html" class="btn-nav-link">Регистрация</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <h2 class="section-title">Виртуальная корзина</h2>
        
        <div class="cart-layout">
            <!-- Левая колонка: список выбранных книг -->
            <div id="cart-page-list">
                <p style="color: var(--text-muted); padding: 20px 0;">Загрузка товаров...</p>
            </div>

            <!-- Правая колонка: параметры доставки, оплаты и итог -->
            <div class="cart-summary-box">
                <h3>Оформление бронирования</h3>
                <form id="orderForm">
                    <div class="form-group-cart">
                        <label for="cart-delivery">Способ получения:</label>
                        <select id="cart-delivery" required>
                            <option value="pickup">Самовывоз (ул. Тельмана, д. 25)</option>
                            <option value="delivery">Курьерская доставка по г. Энгельс</option>
                        </select>
                    </div>

                    <div class="form-group-cart">
                        <label for="cart-payment">Форма оплаты:</label>
                        <select id="cart-payment" required>
                            <option value="card">Банковской картой при получении</option>
                            <option value="cash">Наличными при получении</option>
                        </select>
                    </div>

                    <div class="total-price-row">
                        <span style="font-weight: 600; color: var(--text-muted);">Итого к оплате:</span>
                        <span style="font-size: 1.5rem; font-weight: 800;"><span id="cart-page-total">0</span> ₽</span>
                    </div>

                    <button type="submit" class="btn btn-primary" id="checkout-page-btn">Подтвердить заказ</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 ООО «БукСтраница». г. Энгельс, ул. Тельмана, д. 25. +7 (8453) 55-00-25. Все права защищены.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
